
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Sayang</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #ffc0cb, #ffe6eb);
      color: #5c2a2a;
      text-align: center;
      padding: 30px;
    }
    h1 {
      font-size: 2.5em;
      color: #d6336c;
    }
    p {
      font-size: 1.2em;
      max-width: 600px;
      margin: 20px auto;
    }
    .photo {
      margin: 30px auto;
    }
    img {
      width: 250px;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
    }
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: float 6s infinite;
    }
    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }
    .heart::before {
      top: -10px;
      left: 0;
    }
    .heart::after {
      left: -10px;
      top: 0;
    }
    @keyframes float {
      0% {
        transform: translateY(0) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) rotate(45deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>Happy Birthday Sayang 💖</h1>
  <p>Selamat ulang tahun, Sayangg. Makasiii yaa udah hadir di hidup aku.<br>
    Kamu udaa bikin aku jauhh lebih bahagiaa.<br>
    Semoga hari ini seindahhh secantikk seimutt secakepp hati kamu, dan semoga aku bisa terus jadi bagian dari kebahagiaanmu.<br>
    I Love You Bbyy 💕</p>

  <div class="photo">
    <img src="https://via.placeholder.com/250x350.png?text=Foto+Kita" alt="Foto kita">
  </div>

  <audio autoplay loop>
    <source src="https://cdn.pixabay.com/audio/2022/08/11/audio_9b7d929ee3.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div class="hearts">
    <script>
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.top = Math.random() * 100 + 'vh';
        heart.style.animationDelay = Math.random() * 5 + 's';
        document.querySelector('.hearts').appendChild(heart);
      }
    </script>
  </div>
</body>
</html>
